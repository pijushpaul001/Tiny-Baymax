name: Python tests

on:
  push:
    branches: [main, "work/**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dotenv: ["present", "absent"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare dotenv and shell environment fixture
        shell: bash
        run: |
          if [ "${{ matrix.dotenv }}" = "present" ]; then
            printf 'GEMINI_API_KEY=dummy-dotenv-key\nBAYMAX_MODEL=dotenv-test-model\nBAYMAX_FALLBACK_MODEL=dotenv-test-fallback\n' > .env
          else
            rm -f .env
            {
              echo "GEMINI_API_KEY=dummy-shell-key"
              echo "BAYMAX_MODEL=shell-test-model"
              echo "BAYMAX_FALLBACK_MODEL=shell-test-fallback"
              echo "BAYMAX_DATA_DIR=/tmp/baymax-shell-data"
            } >> "$GITHUB_ENV"
          fi
      - name: Compile Python sources
        run: python -m compileall -q baymax server tests
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -t . -v
